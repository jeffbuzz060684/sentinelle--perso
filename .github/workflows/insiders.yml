name: Relevé initiés (toutes les 2 h, jours ouvrés)
on:
  schedule:
    # 05:07-21:07 UTC du lundi au vendredi = 6h07-22h07 Paris, toutes les 2 h
    - cron: "7 5-21/2 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: "insiders"
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Relevé FR (AMF) + US (SEC)
        run: node tools/fetch-insiders.js
      - name: Commit si changé
        id: changed
        run: |
          if ! git diff --quiet; then
            git config user.name "radar-inities-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data.json state.json
            git commit -m "chore: relevé initiés $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Redéployer Pages (un push GITHUB_TOKEN ne déclenche aucun workflow)
        if: steps.changed.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
