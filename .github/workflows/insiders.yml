name: Relevé initiés (toutes les 2 h, jours ouvrés)
on:
  schedule:
    # 05:07-23:07 UTC du lundi au vendredi, toutes les 2 h
    # (Paris : 6h07-0h07/+1 selon la saison ; le dernier run couvre les dépôts US de fin de journée ET)
    - cron: "7 5-23/2 * * 1-5"
    # v3.3 : 02:07 UTC du mardi au samedi — couvre les dépôts US de 18 h à 22 h ET de la veille
    # (le dernier run existant s'arrête à 18:07-19:07 ET, selon la saison)
    - cron: "7 2 * * 2-6"
  workflow_dispatch:
# v4.0.5 : permissions au niveau JOB uniquement (rien au niveau workflow)
concurrency:
  group: "insiders"
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit des relevés data.json/state.json
      actions: write # gh workflow run pages.yml (redéploiement après relevé)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Contact SEC défini ? (exigé par la SEC dans le User-Agent)
        run: |
          if [ -z "$RI_SEC_CONTACT" ]; then
            echo "::warning::RI_SEC_CONTACT non défini — le User-Agent utilise l'adresse noreply de repli, que personne ne lit si la SEC veut signaler un abus. Crée le secret avec une adresse que tu lis."
          else
            echo "RI_SEC_CONTACT défini."
          fi
        env:
          RI_SEC_CONTACT: ${{ secrets.RI_SEC_CONTACT }}
      - name: Relevé FR (AMF) + US (SEC)
        run: node tools/fetch-insiders.js
        env:
          # contact réel exigé par la SEC dans le User-Agent (facultatif : repli GitHub noreply)
          RI_SEC_CONTACT: ${{ secrets.RI_SEC_CONTACT }}
          # topic ntfy.sh des notifications (clusters 🔥🔥, achats ≥ 100 k par un dirigeant) —
          # en secret car le dépôt est public ; absent = pas d'envoi, run normal
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # v4.0.8 : dead man's switch — ping healthchecks.io après chaque run qui va au bout
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
      - name: Validation des données
        run: node tools/validate-data.js
      - name: Commit si changé
        id: changed
        run: |
          # v4.0.8 : git status --porcelain — ops.json est non tracké au premier run.
          if [ -n "$(git status --porcelain data.json state.json ops.json)" ]; then
            git config user.name "sentinelle-bot"
            git config user.email "actions@github.com"
            git add data.json state.json ops.json
            git commit -m "scan: initiés $(date -u '+%Y-%m-%d %Hh UTC')"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Conserver ops.json même en échec (mémoire des pannes)
        if: failure()
        run: |
          if [ -n "$(git status --porcelain -- ops.json)" ]; then
            git config user.name "sentinelle-bot"
            git config user.email "actions@github.com"
            git add ops.json
            git commit -m "ops: panne initiés $(date -u '+%Y-%m-%d %Hh UTC')"
            git pull --rebase origin main
            git push
          fi
      - name: Redéployer Pages si les listes OU les statuts de source ont changé
        if: steps.changed.outputs.changed == 'true'
        run: |
          # Le diff exclut les horodateurs (updated/frUpdated/usUpdated/counts) mais PAS
          # frOk/usOk : un changement de statut de source (panne ou retour à la normale)
          # DOIT atteindre l'app statique, sinon le bandeau d'erreur ne s'affiche jamais.
          if git diff HEAD~1 --unified=0 -- data.json | grep -E '^[+-]' | grep -vE '^[+-]{3}|"(updated|frUpdated|usUpdated|counts)":' | grep -q .; then
            gh workflow run pages.yml --ref main
          else
            echo "data.json : seuls les horodateurs ont changé — pas de redéploiement"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
