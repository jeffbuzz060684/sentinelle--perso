name: Relevé initiés (toutes les 2 h, jours ouvrés)
on:
  schedule:
    # 05:07-23:07 UTC du lundi au vendredi, toutes les 2 h
    # (Paris : 6h07-0h07/+1 selon la saison ; le dernier run couvre les dépôts US de fin de journée ET)
    - cron: "7 5-23/2 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: "insiders"
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Relevé FR (AMF) + US (SEC)
        run: node tools/fetch-insiders.js
        env:
          # contact réel exigé par la SEC dans le User-Agent (facultatif : repli GitHub noreply)
          RI_SEC_CONTACT: ${{ secrets.RI_SEC_CONTACT }}
      - name: Validation des données
        run: node tools/validate-data.js
      - name: Commit si changé
        id: changed
        run: |
          if ! git diff --quiet; then
            git config user.name "sentinelle-bot"
            git config user.email "actions@github.com"
            git add data.json state.json
            git commit -m "scan: initiés $(date -u '+%Y-%m-%d %Hh UTC')"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Redéployer Pages seulement si les listes ont changé
        if: steps.changed.outputs.changed == 'true'
        run: |
          if git diff HEAD~1 --unified=0 -- data.json | grep -E '^[+-]' | grep -vE '^[+-]{3}|"(updated|frUpdated|usUpdated|frOk|usOk|counts)":' | grep -q .; then
            gh workflow run pages.yml --ref main
          else
            echo "data.json : seuls les horodateurs ont changé — pas de redéploiement"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
