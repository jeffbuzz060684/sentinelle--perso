name: Scan initiés
on:
  schedule:
    - cron: '0 * * * *'   # horaire : délais AMF 3 j ouvrés / SEC 2 j ouvrés
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # commit data.json
  actions: write     # relancer pages.yml (push GITHUB_TOKEN ne déclenche rien)

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan FR (AMF/BDIF) + US (SEC EDGAR)
        run: node tools/fetch-insiders.js
      - name: Validation
        run: node tools/validate-data.js
      - name: Commit si changé
        id: commit
        run: |
          if git diff --quiet -- data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "sentinelle-bot"
            git config user.email "actions@github.com"
            git add data.json
            git commit -m "scan: achats initiés $(date -u '+%Y-%m-%d %Hh UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redéployer les Pages
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
