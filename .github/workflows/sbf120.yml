name: Composition SBF 120 (mensuelle)
on:
  schedule:
    # Révisions Euronext : mars, juin, septembre, décembre — on reconstruit le 3 du mois
    # à 04:37 UTC pour être prêt avant les révisions, et le fichier ne bouge sinon pas.
    - cron: "37 4 3 * *"
  workflow_dispatch:
# v4.0.5 : permissions au niveau JOB uniquement (rien au niveau workflow)
concurrency:
  group: "sbf120"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit de sbf120.json
      actions: write # gh workflow run pages.yml (redéploiement après rebuild)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Reconstruction de la composition (Wikipédia FR + tickers)
        run: node tools/build-sbf120.js
        # Garde intégrée : composition attendue 40/20/60 uniques disjoints, sinon exit 1
        # sans écraser sbf120.json (une navbox vandalisée ne doit jamais atteindre l'app).
      - name: Validation
        run: node tools/validate-quotes.js
      - name: Commit si changé
        id: changed
        run: |
          if ! git diff --quiet; then
            git config user.name "sentinelle-bot"
            git config user.email "actions@github.com"
            git add sbf120.json
            git commit -m "sbf120: composition $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Redéployer Pages si la composition a changé
        if: steps.changed.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
