name: Figer une version (tag + release, manuel)
# v4.0.8 — demande de la revue du 09/11 : « Pose un tag ou une release pour figer cet état. »
# Le connecteur GitHub de l'assistant ne crée pas de tags : ce workflow le fait à la demande.
# Actions → « Figer une version » → Run workflow → version (ex. 4.0.7) + SHA optionnel
# (par défaut HEAD ; pour figer un état passé, coller le SHA complet du commit).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à figer (ex. 4.0.7)"
        required: true
      sha:
        description: "SHA complet du commit (vide = HEAD)"
        required: false
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # accès à n'importe quel commit passé
      - name: Vérifier le format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version invalide : ${{ inputs.version }} (attendu X.Y.Z)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${{ inputs.version }}" >/dev/null; then
            echo "::error::le tag v${{ inputs.version }} existe déjà"
            exit 1
          fi
      - name: Tag + release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET="${{ inputs.sha }}"
          if [ -z "$TARGET" ]; then TARGET="$(git rev-parse HEAD)"; fi
          git config user.name "sentinelle-bot"
          git config user.email "actions@github.com"
          git tag -a "v${{ inputs.version }}" -m "Sentinelle perso v${{ inputs.version }}" "$TARGET"
          git push origin "v${{ inputs.version }}"
          gh release create "v${{ inputs.version }}" --target "$TARGET" --generate-notes --title "Sentinelle perso v${{ inputs.version }}"
          echo "Tag v${{ inputs.version }} posé sur $TARGET + release créée."
