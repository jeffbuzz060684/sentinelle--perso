name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Harnais de tests (bloquant)
        run: |
          node tools/gen-icons.js
          node tools/test.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer les icônes PNG + construire dist/
        run: |
          node tools/gen-icons.js
          # v4.0 : secours cotations — si le cron quotes.yml est retardé ou sauté
          # (charge GitHub Actions : les schedules peuvent l'être), chaque déploiement
          # tente un relevé frais depuis le runner. Non bloquant : en cas d'échec,
          # le quotes.json du dernier commit (cron) est servi tel quel.
          if node tools/fetch-quotes.js && node tools/validate-quotes.js; then
            echo "cotes fraîches générées pour ce déploiement"
          else
            git checkout -- quotes.json 2>/dev/null || rm -f quotes.json
            echo "::warning::Relevé des cotes en échec (ou invalide) — quotes.json du dernier commit servi s'il existe"
          fi
          # v3.3 : Pages ne publie plus tout le dépôt (outils, workflows, state) —
          # uniquement les fichiers de l'app, dans dist/
          # v4.0 : quotes.json/sbf120.json copiés s'ils existent (tolérant tant que
          # le premier cron cotations n'a pas encore tourné)
          mkdir -p dist
          cp index.html logic.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png data.json dist/
          test -f quotes.json && cp quotes.json dist/ || echo "  note : quotes.json absent du dépôt"
          test -f sbf120.json && cp sbf120.json dist/ || echo "  note : sbf120.json absent du dépôt"
          ls dist/
      - name: Valider data.json
        run: node tools/validate-data.js
      - name: Valider quotes.json + sbf120.json
        run: |
          cd dist && node ../tools/validate-quotes.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
