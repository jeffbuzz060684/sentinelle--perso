name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  # v4.0.5 : permissions au plus juste, PAR JOB (plus rien au niveau workflow).
  contents: read
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # harnais : lecture du code uniquement
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Harnais de tests (bloquant)
        run: |
          node tools/gen-icons.js
          node tools/test.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # v4.0.1 : contents: write pour le secours cotations — ce job commit quotes.json
      # quand le relevé du déploiement réussit (un push au GITHUB_TOKEN ne re-déclenche
      # AUCUN workflow : pas de boucle, et le cron insiders fait un pull --rebase).
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Générer les icônes PNG + construire dist/
        run: |
          node tools/gen-icons.js
          # v4.0 : secours cotations — si le cron quotes.yml est retardé ou sauté
          # (charge GitHub Actions : les schedules peuvent l'être), chaque déploiement
          # tente un relevé frais depuis le runner. Non bloquant : en cas d'échec,
          # le quotes.json du dernier commit (cron) est servi tel quel.
          # v4.0.4 : --max-age-min=20 = anti-doublon — si le cron cotations a déjà livré
          # un relevé de moins de 20 min (ou que le ping horaire vient de passer), on ne
          # re-collecte pas : une seule collecte par cycle, appels réseau économisés.
          if node tools/fetch-quotes.js --max-age-min=20 --max-age-targets-min=720 && node tools/validate-quotes.js; then
            echo "cotes fraîches générées pour ce déploiement"
            # cumul : le relevé réussi est committé (le 404 disparaît durablement) ;
            # le push au GITHUB_TOKEN ne déclenche AUCUN workflow — pas de boucle.
            git config user.name "sentinelle-bot"
            git config user.email "actions@github.com"
            git add quotes.json
            if ! git diff --cached --quiet; then
              git commit -m "quotes: secours déploiement $(date -u '+%Y-%m-%d %Hh%M UTC')"
              git pull --rebase origin main
              git push || echo "::warning::push quotes.json en échec (rebase ?) — dist/ servi quand même"
            fi
          else
            git checkout -- quotes.json 2>/dev/null || rm -f quotes.json
            echo "::warning::Relevé des cotes en échec (ou invalide) — quotes.json du dernier commit servi s'il existe"
          fi
          # v3.3 : Pages ne publie plus tout le dépôt (outils, workflows, state) —
          # uniquement les fichiers de l'app, dans dist/
          # v4.0 : quotes.json/sbf120.json copiés s'ils existent (tolérant tant que
          # le premier cron cotations n'a pas encore tourné)
          mkdir -p dist
          cp index.html logic.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png data.json dist/
          test -f quotes.json && cp quotes.json dist/ || echo "  note : quotes.json absent du dépôt"
          test -f sbf120.json && cp sbf120.json dist/ || echo "  note : sbf120.json absent du dépôt"
          # v4.0.10 : le journal de validation est cité dans l'aide de l'app — servi pour être vérifiable
          test -f journal-scores.jsonl && cp journal-scores.jsonl dist/ || echo "  note : journal-scores.jsonl absent du dépôt"
          ls dist/
        # v4.0.8 : le secours cotations met à jour ops.json (mémoire des pannes) et peut
        # envoyer l'alerte de transition / le ping dead man comme le cron dédié.
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
      - name: Valider data.json
        run: node tools/validate-data.js
      - name: Valider quotes.json + sbf120.json
        run: |
          cd dist && node ../tools/validate-quotes.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: "dist"
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
